<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>标签打印网页端</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid-item {
            text-align: center;
        }

        .button-container{
            margin: 20px ;
        }

        .img{
            width: 80%;
            height: auto;
        }

        .img:active{
            transform: scale(0.95);
            filter: brightness(85%)

        }

        .rounded-button {
            padding: 5px 20px; /* 增加按钮的内边距以放大按钮 */
            font-size: 18px; /* 增大字体以适应放大的按钮 */
            border-radius: 15px; /* 设置圆角 */
            border: none; /* 去掉默认边框 */
            background-color: #4CAF50; /* 设置按钮背景颜色 */
            color: white; /* 设置文字颜色 */
            cursor: pointer; /* 鼠标悬停时显示为手形 */
            transition: background-color 0.3s; /* 添加过渡效果 */
        }

        .rounded-button:hover {
            background-color: #45a049; /* 悬停时改变背景颜色 */
        }

        .rounded-button2{
            padding: 5px 20px; /* 增加按钮的内边距以放大按钮 */
            font-size: 20px; /* 增大字体以适应放大的按钮 */
            border-radius: 15px; /* 设置圆角 */
            border: none; /* 去掉默认边框 */
            background-color: #d73a35; /* 设置按钮背景颜色 */
            color: white; /* 设置文字颜色 */
            cursor: pointer; /* 鼠标悬停时显示为手形 */
            transition: background-color 0.3s; /* 添加过渡效果 */

        }

        .rounded-button2:hover {
            background-color: #701311 /* 悬停时改变背景颜色 */
        }
        .responsive-input {
            width: 100%; /* 设置宽度为父容器的100% */
            padding: 2px; /* 添加一些内边距 */
            box-sizing: border-box; /* 包括内边距和边框在内的总宽度 */
            font-size: 16px; /* 设置字体大小 */
            text-align: center
        }

        .rounded-button:active{
            transform: scale(0.9)
        }
        .rounded-button2:active{
            transform: scale(0.9)
        }
        .input-container {
            max-width: 300px; /* 父容器的最大宽度 */
            margin: 0 auto; /* 居中显示 */

        }

    </style>

</head>
<body>
<form method="post">
    <div class="grid-container" style="height: 70%;width: 58vh">
        {% for name in image_files %}
        <div class="grid-item">
            <img class="img" src="{{ img_address + name + '.jpg' }}" alt="{{ name }}" ontouchstart="shrinkImage(this)" ontouchend="resetImage(this)" onclick="incrementValue('{{ name }}')">
            <div class="input-container">
                <input class="responsive-input" type="text" id="entry-{{ name }}" name="{{ name }}" value="{{ entries[name] }}" readonly>
            </div>

        </div>
        {% endfor %}
    </div>
    <div></div>
    <div class="button-container" style="height: 20%;width: 58vh">
        <button type="submit" name="switch" class="rounded-button">切换标签</button>
        <button type="submit" name="print_date" class="rounded-button2" style="background-color: #006699">日期标签</button>
        <button type="submit" name="print" class="rounded-button2" onclick="callPrintLabel()">开始打印</button>
    </div>

    <script>
        function shrinkImage(img) {
            img.style.transform = 'scale(0.9)';
        }

        function resetImage(img) {
            img.style.transform = 'scale(1)';
        }
        function incrementValue(name) {
            // 获取相应的输入框
            var inputField = document.getElementById('entry-' + name);
            // 将输入框的值转换为整数并加1
            var currentValue = parseInt(inputField.value);
            inputField.value = currentValue + 1;
        }
        function callPrintLabel() {
            fetch('/print', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                {#alert(data.message);#}
            })
            .catch(error => {
                console.error('There has been a problem with your fetch operation:', error);
                {#alert('An error occurred: ' + error.message);#}
            });
        }

    </script>

</form>
</body>
</html>
